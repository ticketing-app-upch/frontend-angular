name: Frontend CI

on:
  push:
    branches: [main, develop, feat/frontend-mvp, 'feat/demo-*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
        env:
          API_BACKEND_URL: https://backend.example.test/api
          API_PRICING_URL: https://backend.example.test/api
          USE_MOCK: 'false'
          USE_MOCK_AUTH: 'false'
      - name: El bundle debe quedar en modo backend (no mock)
        run: |
          grep -rq 'backend.example.test/api' dist/tkt/browser/*.js
          if grep -rq 'useMock:!0' dist/tkt/browser/*.js; then
            echo '::error::useMock sigue en true dentro del bundle: set-env.mjs no aplicó USE_MOCK=false.'
            exit 1
          fi
