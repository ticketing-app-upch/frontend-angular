name: Frontend CI

on:
  push:
    branches: [main, develop, feat/frontend-mvp, 'feat/demo-*', integracion-back-front]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'angular.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'angular.json'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
