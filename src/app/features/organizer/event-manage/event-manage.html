<div class="tkt-page">
  <div class="tkt-cluster head">
    <div>
      <h1 class="tkt-section-title">Mis eventos</h1>
      <p class="tkt-section-sub">Consulta tus eventos publicados y crea uno sobre un recinto predefinido.</p>
    </div>
    <span class="tkt-spacer"></span>
    <a mat-flat-button routerLink="/organizador/eventos/nuevo">
      <mat-icon>add</mat-icon> Nuevo evento
    </a>
  </div>

  @if (loading()) {
    <div class="loading"><mat-progress-spinner mode="indeterminate" diameter="42" /></div>
  } @else if (items().length === 0) {
    <tkt-empty-state
      icon="event_note"
      title="No tienes eventos"
      message="Empieza creando tu primer evento y sus zonas."
    >
      <a mat-flat-button routerLink="/organizador/eventos/nuevo">Crear evento</a>
    </tkt-empty-state>
  } @else {
    <div class="list">
      @for (ev of items(); track ev.id) {
        <article class="row">
          <img [src]="ev.bannerUrl || ev.imageUrl" [alt]="ev.name" />
          <div class="main">
            <div class="row-top">
              <h2>{{ ev.name }}</h2>
            </div>
            <p class="meta">
              {{ ev.startsAt | date: "d 'de' MMM, y · HH:mm" }}
            </p>
          </div>
        </article>
      }
    </div>
  }
</div>
